services:
  greatgatsby-budget:
    image: ghcr.io/charliec94/greatgatsby-budget:latest
    container_name: GreatGatsby-Budget
    user: "0"
    ports:
      - "8081:8000"
    volumes:
      - /mnt/user/appdata/greatgatsby-budget:/data:rw
    environment:
      APP_DATABASE: /data/greatgatsby.db
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY before starting}
      GOALS_BASE_URL: ${GOALS_BASE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    restart: unless-stopped
