<form method="get" class="register-filters">
<label>Search<input name="q" value="{{filters.q}}" placeholder="Payee or memo"></label>
<label>From<input type="date" name="start" value="{{filters.start}}"></label><label>Through<input type="date" name="end" value="{{filters.end}}"></label>
<label>Category<select name="category"><option value="">All categories</option><option value="uncategorized" {% if filters.category=='uncategorized' %}selected{% endif %}>Uncategorized</option>{% for c in categories %}<option value="{{c.id}}" {% if filters.category==c.id|string %}selected{% endif %}>{{c.parent_name}} › {{c.name}}</option>{% endfor %}</select></label>
<label>Status<select name="status"><option value="">All statuses</option>{% for value,label in [('0','Uncleared'),('1','Cleared'),('2','Reconciled')] %}<option value="{{value}}" {% if filters.status==value %}selected{% endif %}>{{label}}</option>{% endfor %}</select></label>
<label>Direction<select name="direction"><option value="">Both</option>{% for value in ['outflow','inflow'] %}<option value="{{value}}" {% if filters.direction==value %}selected{% endif %}>{{value|title}}</option>{% endfor %}</select></label>
<label>Sort<select name="sort">{% for value,label in [('', 'Newest first'),('oldest','Oldest first'),('payee','Payee A–Z'),('amount','Amount: low to high'),('amount_desc','Amount: high to low')] %}<option value="{{value}}" {% if filters.sort==value %}selected{% endif %}>{{label}}</option>{% endfor %}</select></label><button>Apply</button><a href="{{url_for('account_register',account_id=account.id)}}">Reset</a>
</form>
<p class="muted">Showing {{transactions|length}} of {{total_count}} transactions. Balances include the full account history.</p>
<form id="register-bulk" method="post" action="{{url_for('account_bulk',account_id=account.id)}}" class="register-bulk" onsubmit="return this.querySelector('[name=action]').value!=='delete'||confirm('Permanently delete selected ordinary transactions? Transfers and reconciled entries will be skipped.')">
<input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label><input type="checkbox" id="register-select-all"> Select visible</label><span id="register-selection-count">0 selected</span>
<select name="action" aria-label="Bulk action"><option value="clear">Mark cleared</option><option value="unclear">Mark uncleared</option><option value="categorize">Assign category</option><option value="delete">Delete</option></select>
<select name="category_id" aria-label="Bulk category"><option value="">Choose category (for assignment)</option>{% for c in categories %}<option value="{{c.id}}">{{c.parent_name}} › {{c.name}}</option>{% endfor %}</select><button id="register-bulk-submit" disabled>Apply to selected</button></form>
<script>document.addEventListener('DOMContentLoaded',()=>{const boxes=[...document.querySelectorAll('.register-select')],all=document.getElementById('register-select-all');function update(){const count=boxes.filter(b=>b.checked).length;document.getElementById('register-selection-count').textContent=`${count} selected`;document.getElementById('register-bulk-submit').disabled=!count;all.checked=boxes.length>0&&count===boxes.length;all.indeterminate=count>0&&count<boxes.length}all.addEventListener('change',()=>{boxes.forEach(b=>b.checked=all.checked);update()});boxes.forEach(b=>b.addEventListener('change',update))})</script>
