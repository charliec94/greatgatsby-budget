<dialog id="transfer-dialog"><form method="post" action="{{url_for('add_transfer')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="return_account" value="{{account.id}}"><h2>Transfer between accounts</h2><p class="muted">Credit-card payments are transfers from a cash account to the card.</p><label>From<select name="source_account_id" required><option value="">Choose account</option>{% for a in accounts %}<option value="{{a.id}}">{{a.name}}</option>{% endfor %}</select></label><label>To<select name="target_account_id" required><option value="">Choose account</option>{% for a in accounts %}<option value="{{a.id}}">{{a.name}}</option>{% endfor %}</select></label><label>Date<input name="occurred_on" type="date" value="{{today.isoformat()}}"></label><label>Amount<input name="amount" type="number" step="0.01" min="0.01" required></label><label>Memo<input name="memo"></label><div class="dialog-actions"><button type="button" class="outline" onclick="this.closest('dialog').close()">Cancel</button><button>Record transfer</button></div></form></dialog>
