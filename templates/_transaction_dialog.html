<dialog id="transaction-dialog" class="transaction-entry"><form method="post" action="{{url_for('add_transaction')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% if transaction_account_id %}<input type="hidden" name="account_id" value="{{transaction_account_id}}"><input type="hidden" name="return_account" value="{{transaction_account_id}}">{% endif %}<h2>Add transaction{% if transaction_account_id %} to {{account.name}}{% endif %}</h2>
{% if not transaction_account_id %}<label>Account<select name="account_id" required><option value="">Choose account</option>{% for a in accounts %}<option value="{{a.id}}">{{a.name}}</option>{% endfor %}</select></label>{% endif %}
<div class="entry-grid"><label>Date<input name="occurred_on" type="date" value="{{today.isoformat()}}" required></label><label>Status<select name="cleared"><option value="0">Uncleared</option><option value="1">Cleared</option></select></label></div>
<label>Payee<input class="entry-payee" name="payee" list="known-payees" autocomplete="off" required><datalist id="known-payees">{% for rule in payee_rules %}<option value="{{rule.display_name}}"></option>{% endfor %}</datalist></label>
<label class="entry-category">Category<select name="category_id"><option value="">Uncategorized</option>{% for c in entry_categories %}<option value="{{c.id}}">{{c.parent_name}} › {{c.name}}</option>{% endfor %}</select><small class="payee-suggestion" hidden>Suggested from this payee’s past activity.</small></label>
<div class="entry-grid money-fields"><label>Outflow<input name="outflow" type="number" min="0" step="0.01" placeholder="0.00"></label><label>Inflow<input name="inflow" type="number" min="0" step="0.01" placeholder="0.00"></label></div>
<label>Memo<input name="memo"></label><label class="split-toggle"><input type="checkbox" onchange="toggleNewSplit(this)"> Split across categories<input type="hidden" name="is_split" value="0"></label>
<section class="new-split" hidden><div class="split-math"><div><span>Transaction</span><strong class="new-total">$0.00</strong></div><div><span>Assigned</span><strong class="new-assigned">$0.00</strong></div><div><span>Remaining</span><strong class="new-remaining">$0.00</strong></div></div><div class="new-split-lines">{% for _ in range(2) %}<div class="split-line"><select name="split_category_id" disabled>{% for c in entry_categories %}<option value="{{c.id}}">{{c.parent_name}} › {{c.name}}</option>{% endfor %}</select><input name="split_amount" type="number" min="0.01" step="0.01" placeholder="0.00" disabled><button type="button" class="remove-line" onclick="removeNewSplitLine(this)">×</button></div>{% endfor %}</div><button type="button" class="outline" onclick="addNewSplitLine(this)">＋ Add line</button></section>
<div class="dialog-actions"><button type="button" class="outline" onclick="this.closest('dialog').close()">Cancel</button><button class="save-new-transaction">Add transaction</button></div></form></dialog>
<script>const payeeCategoryRules={{payee_rules|map(attribute='payee_key')|list|zip(payee_rules|map(attribute='category_id')|list)|list|tojson if false else '{}'}};document.addEventListener('DOMContentLoaded',()=>{const dialog=document.getElementById('transaction-dialog');if(!dialog)return;const rules={};{% for rule in payee_rules %}rules[{{rule.payee_key|tojson}}]={{rule.category_id}};{% endfor %}dialog.querySelector('.entry-payee').addEventListener('change',event=>{const key=event.target.value.trim().toLowerCase().replace(/\s+/g,' '),category=rules[key],select=dialog.querySelector('[name=category_id]'),note=dialog.querySelector('.payee-suggestion');if(category){select.value=category;note.hidden=false}else note.hidden=true});dialog.addEventListener('input',()=>updateNewSplit(dialog))});function toggleNewSplit(box){const dialog=box.closest('dialog'),section=dialog.querySelector('.new-split'),enabled=box.checked;section.hidden=!enabled;dialog.querySelector('[name=is_split]').value=enabled?'1':'0';dialog.querySelector('.entry-category select').disabled=enabled;section.querySelectorAll('select,input').forEach(field=>field.disabled=!enabled);updateNewSplit(dialog)}function addNewSplitLine(button){const section=button.closest('.new-split'),line=section.querySelector('.split-line').cloneNode(true);line.querySelectorAll('input').forEach(input=>input.value='');section.querySelector('.new-split-lines').appendChild(line);updateNewSplit(button.closest('dialog'))}function removeNewSplitLine(button){const dialog=button.closest('dialog');if(dialog.querySelectorAll('.new-split .split-line').length>2)button.closest('.split-line').remove();updateNewSplit(dialog)}function updateNewSplit(dialog){const outflow=Number(dialog.querySelector('[name=outflow]').value)||0,inflow=Number(dialog.querySelector('[name=inflow]').value)||0,total=Math.max(outflow,inflow),assigned=[...dialog.querySelectorAll('.new-split [name=split_amount]:not(:disabled)')].reduce((sum,input)=>sum+(Number(input.value)||0),0),remaining=total-assigned,enabled=dialog.querySelector('[name=is_split]').value==='1';dialog.querySelector('.new-total').textContent=entryMoney(total);dialog.querySelector('.new-assigned').textContent=entryMoney(assigned);dialog.querySelector('.new-remaining').textContent=entryMoney(remaining);dialog.querySelector('.save-new-transaction').disabled=(outflow>0&&inflow>0)||(enabled&&Math.abs(remaining)>.004)}function entryMoney(value){return `${value<0?'−':''}$${Math.abs(value).toFixed(2)}`}</script>
