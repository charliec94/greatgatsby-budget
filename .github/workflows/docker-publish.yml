name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run application tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Verify bind-mounted persistence and non-root application user
        run: |
          docker build -t greatgatsby-budget-ci .
          mkdir -p ci-data
          chmod 777 ci-data
          docker run -d --name ggb-ci -p 18081:8000 -v "$PWD/ci-data:/data" -e APP_SECRET_KEY=ci-only-secret greatgatsby-budget-ci
          for attempt in {1..30}; do docker inspect --format='{{.State.Health.Status}}' ggb-ci | grep -q healthy && break; sleep 1; done
          test "$(docker exec ggb-ci id -u)" != "0"
          docker exec ggb-ci sh -c 'echo persisted > /data/ci-persistence-check'
          docker rm -f ggb-ci
          docker run -d --name ggb-ci -p 18081:8000 -v "$PWD/ci-data:/data" -e APP_SECRET_KEY=ci-only-secret greatgatsby-budget-ci
          docker exec ggb-ci test -f /data/ci-persistence-check
          docker rm -f ggb-ci
          docker run -d --name ggb-ci-root --user 0 -p 18081:8000 -v "$PWD/ci-data:/data" -e APP_SECRET_KEY=ci-only-secret greatgatsby-budget-ci
          for attempt in {1..30}; do docker inspect --format='{{.State.Health.Status}}' ggb-ci-root | grep -q healthy && break; sleep 1; done
          test "$(docker exec ggb-ci-root stat -c %u /proc/1)" != "0"
          docker exec ggb-ci-root test -f /data/ci-persistence-check
          docker rm -f ggb-ci-root

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/charliec94/greatgatsby-budget:latest
            ghcr.io/charliec94/greatgatsby-budget:0.1.0
